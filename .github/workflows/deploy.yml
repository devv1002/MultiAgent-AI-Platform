
name: cortex ai deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push Gateway for ECS X86_64
      - name: Build and push Gateway
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -f backend/gateway/Dockerfile \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest" \
            backend

      # Build and push Auth for ECS X86_64
      - name: Build and push Auth
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -f backend/services/auth/Dockerfile \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest" \
            backend

      # Build and push Chat for ECS X86_64
      - name: Build and push Chat
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -f backend/services/chat/Dockerfile \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest" \
            backend

      # Build and push Agent for ECS X86_64
      - name: Build and push Agent
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -f backend/services/agent/Dockerfile \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest" \
            backend

      # Build and push Billing for ECS X86_64
      - name: Build and push Billing
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --push \
            -f backend/services/billing/Dockerfile \
            -t "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest" \
            backend

      # Deploy backend services
      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.GATEWAY_SERVICE }}" \
            --force-new-deployment

      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.AUTH_SERVICE }}" \
            --force-new-deployment

      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.CHAT_SERVICE }}" \
            --force-new-deployment

      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.AGENT_SERVICE }}" \
            --force-new-deployment

      - name: Deploy Billing
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.BILLING_SERVICE }}" \
            --force-new-deployment


      # Diagnose ECS services before waiting
      - name: Diagnose ECS services
        if: always()
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER }}
          GATEWAY_SERVICE_NAME: ${{ secrets.GATEWAY_SERVICE }}
          AUTH_SERVICE_NAME: ${{ secrets.AUTH_SERVICE }}
          CHAT_SERVICE_NAME: ${{ secrets.CHAT_SERVICE }}
          AGENT_SERVICE_NAME: ${{ secrets.AGENT_SERVICE }}
          BILLING_SERVICE_NAME: ${{ secrets.BILLING_SERVICE }}
        run: |
          for SERVICE in \
            "$GATEWAY_SERVICE_NAME" \
            "$AUTH_SERVICE_NAME" \
            "$CHAT_SERVICE_NAME" \
            "$AGENT_SERVICE_NAME" \
            "$BILLING_SERVICE_NAME"
          do
            echo "========== Checking ECS service =========="
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER_NAME" \
              --services "$SERVICE" \
              --query 'services[0].{Name:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount,Events:events[0:3].message}' \
              --output json
          done

      # Wait for ECS to stabilize before completing backend deployment
      
      # Check ECS rollout state and identify any service that is stuck
      - name: Verify backend ECS deployments
        shell: bash
        env:
          ECS_CLUSTER_NAME: ${{ secrets.ECS_CLUSTER }}
          GATEWAY_SERVICE_NAME: ${{ secrets.GATEWAY_SERVICE }}
          AUTH_SERVICE_NAME: ${{ secrets.AUTH_SERVICE }}
          CHAT_SERVICE_NAME: ${{ secrets.CHAT_SERVICE }}
          AGENT_SERVICE_NAME: ${{ secrets.AGENT_SERVICE }}
          BILLING_SERVICE_NAME: ${{ secrets.BILLING_SERVICE }}
        run: |
          SERVICES=(
            "$GATEWAY_SERVICE_NAME"
            "$AUTH_SERVICE_NAME"
            "$CHAT_SERVICE_NAME"
            "$AGENT_SERVICE_NAME"
            "$BILLING_SERVICE_NAME"
          )

          for ATTEMPT in $(seq 1 24); do
            ALL_STABLE=true

            echo "===== ECS check $ATTEMPT/24 ====="

            for SERVICE in "${SERVICES[@]}"; do
              RESULT=$(aws ecs describe-services \
                --cluster "$ECS_CLUSTER_NAME" \
                --services "$SERVICE" \
                --query 'services[0].{Name:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount,Deployments:deployments[*].{Status:status,Rollout:rolloutState,Desired:desiredCount,Running:runningCount}}' \
                --output json)

              echo "$RESULT"

              DESIRED=$(echo "$RESULT" | jq -r '.Desired // 0')
              RUNNING=$(echo "$RESULT" | jq -r '.Running // 0')
              PENDING=$(echo "$RESULT" | jq -r '.Pending // 0')
              DEPLOYMENT_COUNT=$(echo "$RESULT" | jq '.Deployments | length')
              PRIMARY_ROLLOUT=$(echo "$RESULT" | jq -r '[.Deployments[] | select(.Status == "PRIMARY")][0].Rollout // "UNKNOWN"')

              if [[ "$DESIRED" -ne "$RUNNING" ||
                    "$PENDING" -ne 0 ||
                    "$DEPLOYMENT_COUNT" -ne 1 ||
                    "$PRIMARY_ROLLOUT" != "COMPLETED" ]]; then
                ALL_STABLE=false
                echo "::warning::Service $SERVICE is not stable yet."
              fi
            done

            if [[ "$ALL_STABLE" == "true" ]]; then
              echo "All five ECS services are stable."
              exit 0
            fi

            if [[ "$ATTEMPT" -lt 24 ]]; then
              echo "Waiting 15 seconds before checking again..."
              sleep 15
            fi
          done

          echo "::error::ECS deployments did not stabilize within 6 minutes."
          echo "Review the service deployment details printed above."
          exit 1


  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend to S3
        run: |
          aws s3 sync \
            frontend/dist \
            "s3://${{ secrets.S3_BUCKET }}" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
